<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MIKU Store</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modalsAndForms.css">
    <link rel="stylesheet" href="css/publicPages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="header-container container">
            <div class="header-left">
                <a href="index.html" class="logo-link">
                    <span class="logo">MIKU<span class="logo-accent">Store</span></span>
                </a>
            </div>
            <nav class="header-right" aria-label="Navigasi reset password">
                <a href="index.html" class="header-btn">Kembali ke Toko</a>
            </nav>
        </div>
    </header>

    <main class="container public-main">
        <div class="public-auth-wrap">
            <div class="card reset-card">
                <h1>Atur Ulang Password</h1>
                <p class="form-description">Masukkan password baru Anda di bawah ini. Pastikan password mudah diingat dan aman.</p>
                <form id="reset-password-form">
                    <div class="password-wrapper">
                        <input name="newPassword" type="password" placeholder="Password Baru" aria-label="Password Baru" autocomplete="new-password" required>
                        <i class="fas fa-eye-slash toggle-password" aria-hidden="true"></i>
                    </div>
                    <div class="password-wrapper">
                        <input name="confirmPassword" type="password" placeholder="Konfirmasi Password Baru" aria-label="Konfirmasi Password Baru" autocomplete="new-password" required>
                        <i class="fas fa-eye-slash toggle-password" aria-hidden="true"></i>
                    </div>
                    <button type="submit">Simpan Password Baru</button>
                </form>
                <div id="reset-status-msg" class="reset-status-msg hidden" role="status" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-links">
                <a href="/syarat-ketentuan.html">Syarat &amp; Ketentuan</a>
                <a href="/kebijakan-refund.html">Kebijakan Refund</a>
                <a href="/kontak.html">Kontak Kami</a>
                <a href="/cek-transaksi.html">Cek Transaksi</a>
            </div>
            <p>&copy; 2026 MIKU Store. Seluruh hak cipta dilindungi.</p>
        </div>
    </footer>

    <script defer src="js/shared/dom.js"></script>
    <script defer src="js/shared/api.js"></script>
    <script defer src="reset-password.js"></script>
</body>
</html>
